# MD pipeline configuration.
# Paths/executables below assume the pipeline runs inside the container built
# from ./Dockerfile (envs: md / openmm / pymol).

# --- Input ---
# The list of structures to run MD on (see structures.yaml for the format:
# name + path per structure, optional `chains` and an optional per-structure
# `md_ns`/`md_steps` override). Point this at your own list, or put a
# `structures:` list directly in this file instead.
structures_file: "structures.yaml"

# --- Output ---
# results/preprocessing/{system}/    — chain extraction through NPT equilibration
# results/MD/{system}/               — production MD only
# results/params/{system}/md.mdp     — production .mdp with that system's length
output_dir: "results"

# --- Simulation ---
# Base production-MD .mdp: every parameter except `nsteps` is copied verbatim.
mdp_md: "mdp/md.mdp"

# Default production-MD length for structures that don't carry their own
# md_ns / md_steps — set exactly ONE of:
md_ns: 100              # nanoseconds (converted to steps via the base .mdp's dt)
# md_steps: 50000000    # ... or a raw integration-step count

# --- Movie ---
# Render an mp4 of each production trajectory (rule `movie`): water + ions
# stripped, protein as cartoon, any glycans/ligands as sticks.
make_movie: true
movie_skip: 1     # keep every Nth frame (raise for long trajectories)
movie_fps: 15

# --- Compute ---
cpu_threads: 8

# --- Object-storage checkpoint ---
# Once every requested system has reached npt.gro, results/preprocessing/ is
# synced here with `s5cmd sync` before any production MD starts. Blank = skip.
s5cmd_dest: ""   # e.g. "s3://my-bucket/md2affinity/preprocessing/"

# --- Executables (container env paths) ---
pdb2pqr_bin:       "pdb2pqr"                          # md env (on PATH)
gmx_python_bin:    "python3"                          # md env — extract_chains.py
pymol_python_bin:  "/opt/conda/envs/pymol/bin/python" # render_movie.py
openmm_python_bin: "/opt/conda/envs/openmm/bin/python" # minimize_openmm.py
s5cmd_bin:         "s5cmd"
