# AB-Bind-specific inputs for the abbind_scripts/ generators.
#
# These scripts turn the raw AB-Bind dataset into the pipeline's generic
# structures list:
#
#   python abbind_scripts/build_mutants_tsv.py abbind_scripts/abbind.yaml
#       raw dataset -> mutants TSV (one row per pdb_id/mutant, filtered to the
#       structures below)
#
#   python abbind_scripts/build_structures.py abbind_scripts/abbind.yaml
#       mutants TSV -> materialised mutant PDBs (PyMOL) + a structures list
#       (one entry per WT/mutant system), then run the pipeline with:
#
#   snakemake --configfile config.yaml \
#       --config structures_file=structures_abbind.yaml ...

# Raw AB-Bind dataset and the derived mutants TSV (build_mutants_tsv.py).
raw_tsv: "data/PRO-25-393-s002.tsv"
mutants_tsv: "data/mutants.tsv"

# Generic structures list + mutant PDBs written by build_structures.py, and
# the PyMOL interpreter used to apply the mutations (container env layout).
structures_out: "structures_abbind.yaml"
mutants_dir: "data/abbind_mutants"
pymol_python_bin: "/opt/conda/envs/pymol/bin/python"

# Per-PDB map. Each key is a pdb_id (== structure filename stem); its first 4
# chars are the AB-Bind dataset code. `file` is the input PDB; `chain_map`
# (optional) remaps AB-Bind H/L antibody labels to that structure's real
# chain letters — antigen chains pass through unchanged. A fab/fv pair gets
# two keys + files (see 1dqjfv / 1dqjfab).
structures:
  1bj1fv:
    file: "data/structures/1bj1fv.pdb"     # chains H,L,V,W — no remap needed
  1cz8fv:
    file: "data/structures/1cz8fv.pdb"      # chains H,L,V,W — no remap needed
  1jrhfv:
    file: "data/structures/1jrhfv.pdb"      # chains H,I,L — no remap needed
  1dqjfv:
    file: "data/structures/1dqjfv.pdb"      # Fv:  chains A,B,C — antibody is B(H)/A(L)
    chain_map: {H: B, L: A}
  1dqjfab:
    file: "data/structures/1dqjfab.pdb"     # Fab: chains A,B,C — antibody is B(H)/A(L)
    chain_map: {H: B, L: A}
  1vfbfv:
    file: "data/structures/1vfbfv.pdb"      # Fv:  chains A,B,C — antibody is B(H)/A(L), C=lysozyme
    chain_map: {H: B, L: A}
  2nyyfv:
    file: "data/structures/2nyyfv.pdb"      # Fv:  chains A,C,D — antibody is D(H)/C(L), A=antigen
    chain_map: {H: D, L: C}
  2nyyfab:
    file: "data/structures/2nyyfab.pdb"     # Fab: chains A,C,D — antibody is D(H)/C(L), A=antigen
    chain_map: {H: D, L: C}
  2nz9fv:
    file: "data/structures/2nz9fv.pdb"      # Fv:  chains A,C,D — antibody is D(H)/C(L), A=antigen
    chain_map: {H: D, L: C}
  2nz9fab:
    file: "data/structures/2nz9fab.pdb"     # Fab: chains A,C,D — antibody is D(H)/C(L), A=antigen
    chain_map: {H: D, L: C}
